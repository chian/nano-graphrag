repos:
  - repo: local
    hooks:
      - id: python-syntax
        name: Python syntax
        entry: python -m compileall -q method_loop question_pipeline gasl source_table_language tools run_question_pipeline.py
        language: python
        pass_filenames: false
      - id: fatal-python-lint
        name: Fatal Python lint
        entry: python -m flake8 method_loop question_pipeline gasl source_table_language tools run_question_pipeline.py --count --select=E9,F63,F7,F82 --per-file-ignores=gasl/micro_actions.py:F821 --show-source --statistics
        language: python
        additional_dependencies:
          - flake8
        pass_filenames: false
      - id: runtime-invariants
        name: Generic runtime invariants
        entry: python tools/check_runtime_invariants.py
        language: python
        pass_filenames: false
      - id: question-pipeline-invariants
        name: Question-pipeline ownership invariants
        entry: python tools/check_question_pipeline_invariants.py
        language: python
        pass_filenames: false
