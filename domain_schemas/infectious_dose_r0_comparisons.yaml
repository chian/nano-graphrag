domain_name: Infectious Dose And R0 Comparisons
domain_description: A compact evidence graph for extracting infectious-dose measures
  such as ID50/HID50/MID and reproduction-number estimates such as R0, then comparing
  them by disease, pathogen, host, exposure route, country, and time. The graph preserves
  the biological nature of infectious-dose measures while preserving exact source-reported
  R0 context and explicit within-source analyses of variation by country, environment,
  policy, surveillance, or social conditions. Context is not treated as a causal
  explanation unless the same atomic source statement explicitly reports that relation.
entity_types:
  INFECTIOUS_DISEASE:
    merge_policy: exact
    description: A named human or animal infectious disease or syndrome for which
      infectious dose, R0, or both may be reported.
    examples:
    - measles
    - COVID-19
    - influenza
    - cholera
    - tuberculosis
  PATHOGEN:
    merge_policy: exact
    description: The infectious agent that causes a disease, including viruses, bacteria,
      parasites, or fungi. Use this for species-level or broad pathogen names.
    examples:
    - SARS-CoV-2
    - Measles morbillivirus
    - Vibrio cholerae
    - Mycobacterium tuberculosis
  PATHOGEN_STRAIN_OR_VARIANT:
    merge_policy: exact
    description: A strain, lineage, serotype, subtype, isolate, or variant of a pathogen
      when the source reports strain-specific infectious dose or R0 information.
    examples:
    - SARS-CoV-2 Delta variant
    - SARS-CoV-2 Omicron BA.1
    - Influenza A/H1N1
    - Vibrio cholerae O1
  HOST:
    merge_policy: exact
    description: The host species or experimental host system in which infectious
      dose or transmission was measured or inferred.
    examples:
    - humans
    - mice
    - ferrets
    - non-human primates
    - cell culture
  INFECTIOUS_DOSE_MEASURE:
    extraction_enabled: true
    role: source_local_observation
    merge_policy: source_local
    association_fields: [dose_measure, reported_value]
    association_field_kinds:
      dose_measure: dose_measure
      reported_value: numeric_value
    properties:
      disease: string
      pathogen: string
      strain_or_variant: string
      dose_measure: string
      reported_value: number_or_text
      reported_range: number_or_text
      units: string
      uncertainty: string
      endpoint: string
      host: string
      exposure_route: string
      population: string
      time_period: string
      analytical_method: string
    description: A reported biological infectivity or dose-response measure, including
      ID50-like quantities and similar endpoints. This node should capture the raw
      name, standardized type, value or range, units, route, endpoint, host, and whether
      it is human, animal, in vitro, or inferred.
    examples:
    - ID50 = 1000 organisms
    - HID50 = 790 TCID50
    - MID = 10 organisms
    - TCID50
    - EID50
  REPRODUCTION_NUMBER_MEASURE:
    extraction_enabled: true
    role: source_local_observation
    merge_policy: source_local
    association_fields: [reproduction_number_measure, reported_value]
    association_field_kinds:
      reproduction_number_measure: reproduction_measure
      reported_value: numeric_value
    properties:
      disease: string
      pathogen: string
      strain_or_variant: string
      reproduction_number_measure: string
      reported_value: number_or_text
      reported_range: number_or_text
      uncertainty: string
      country: string
      location: string
      host: string
      transmission_mode: string
      population: string
      time_period: string
      intervention_context: string
      behavioral_or_condition_context: string
      analytical_method: string
    description: A reported transmission multiplier estimate such as R0, Rt, Re, or
      an explicitly named reproduction number. R0 should be distinguished from effective
      or time-varying reproduction numbers. Host, transmission mode, intervention,
      and behavioral or condition context are literal attributes of this one atomic
      estimate only when the same exact source clause reports them; they are not
      inferred explanations.
    examples:
    - R0 = 12-18
    - basic reproduction number 2.5
    - Rt = 0.9
    - effective reproduction number 1.3
  MEASURE_TYPE:
    merge_policy: exact
    description: A controlled label for the kind of measure being reported, used to
      prevent mixing biological dose endpoints with epidemiological reproduction numbers.
    examples:
    - ID50
    - HID50
    - MID
    - LD50
    - TCID50
    - R0
    - Rt
    - Re
  EXPOSURE_ROUTE:
    merge_policy: exact
    description: The biological route by which an infectious dose was administered
      or assumed. Route is essential because infectious dose can vary greatly by route.
    examples:
    - inhalation
    - intranasal
    - oral
    - aerosol
    - droplet
    - percutaneous
    - conjunctival
  TRANSMISSION_MODE:
    merge_policy: exact
    description: The dominant mechanism by which a pathogen spreads between hosts,
      used to interpret R0 and country-level variation.
    examples:
    - airborne
    - droplet
    - fecal-oral
    - vector-borne
    - sexual transmission
    - bloodborne
    - direct contact
  COUNTRY:
    merge_policy: exact
    description: A country associated with an R0 estimate, country-level R0 trend,
      outbreak, or contextual factor. Standard country identifiers may be stored when
      available.
    examples:
    - United States
    - India
    - China
    - Brazil
    - United Kingdom
  LOCATION:
    merge_policy: exact
    description: A geographic location smaller or larger than a country, used when
      an estimate is reported for a city, province, region, continent, or global scope.
    examples:
    - Wuhan
    - Lombardy
    - West Africa
    - Europe
    - global
  TIME_PERIOD:
    merge_policy: exact
    description: A calendar or epidemiological interval over which an infectious-dose
      estimate, R0 estimate, trend, intervention, or outbreak applies.
    examples:
    - 1918 pandemic
    - January-March 2020
    - pre-vaccination era
    - 2014-2016 Ebola outbreak
  STUDY_OR_SOURCE:
    extraction_enabled: true
    role: source_mention
    merge_policy: source_local
    description: A publication, report, database, review, outbreak analysis, challenge
      study, or curated source that reports or supports an estimate, comparison, or
      trend.
    examples:
    - human challenge study
    - systematic review
    - WHO report
    - outbreak reconstruction
    - meta-analysis
  ANALYTICAL_METHOD:
    merge_policy: exact
    description: A named model, estimator, or analytical approach used to derive an
      infectious-dose estimate, R0 estimate, comparison, or trend.
    examples:
    - dose-response model
    - exponential growth model
    - SIR model
    - renewal equation
    - meta-analysis
    - rank correlation
  ID50_R0_COMPARISON:
    extraction_enabled: true
    role: source_reported_analysis
    merge_policy: source_local
    association_fields:
    - infectious_dose_measure
    - infectious_dose_value
    - reproduction_number_measure
    - reproduction_number_value
    - relation_term
    association_field_kinds:
      infectious_dose_measure: dose_measure
      infectious_dose_value: reported_scalar
      reproduction_number_measure: reproduction_measure
      reproduction_number_value: reported_scalar
      relation_term: dose_reproduction_relation
    association_connector_policy: binary_pair
    properties:
      disease: string
      pathogen: string
      infectious_dose_measure: string
      infectious_dose_value: number_or_text
      reproduction_number_measure: string
      reproduction_number_value: number_or_text
      relation_term: string
      relationship_type: string
      biological_interpretation: string
      behavioral_or_contextual_interpretation: string
      analytical_method: string
      uncertainty: string
    description: A disease-level or pathogen-level result that one source clause
      directly reports as a relationship between infectious dose and a reproduction
      number. Both measure/value pairs and a short independently literal controlled
      relation predicate are required; pair co-occurrence alone stays candidate-only.
      It should capture whether the relationship is positive, negative, absent,
      inconsistent, qualitative only, or not computable. Pipeline-derived or
      cross-source synthesis belongs in a derived analysis type, not this
      source-local observation type.
    examples:
    - low ID50 and high R0 were negatively correlated
    - ID50 10 organisms and R0 2.1 were not associated
  COUNTRY_R0_RECORD:
    extraction_enabled: false
    role: legacy_compatibility_view
    merge_policy: immutable
    properties:
      disease: string
      pathogen: string
      strain_or_variant: string
      reproduction_number_measure: string
      country: string
      location: string
      reported_value: number_or_text
      reported_range: number_or_text
      uncertainty: string
      population: string
      time_period: string
      trend_direction: string
      trend_magnitude: number_or_text
      analytical_method: string
    description: A legacy graph view for country-specific R0 records. New extraction
      represents the source-local estimate once as REPRODUCTION_NUMBER_MEASURE, whose
      country, location, time, and method fields carry the reported context.
      This type remains readable for historical graph traversal but is never extracted
      as a second observation.
    examples:
    - COVID-19 R0 in Italy
    - Ebola R0 in Liberia
    - measles R0 in the United States
    - 'country trend: increasing'
  COUNTRY_REPRODUCTION_NUMBER_COMPARISON:
    extraction_enabled: false
    role: source_reported_analysis_design_hold
    merge_policy: source_local
    association_fields:
    - reproduction_number_measure
    - focal_country
    - comparison_country
    - relation_term
    association_field_kinds:
      reproduction_number_measure: reproduction_measure
      focal_country: country_scope
      comparison_country: country_scope
      relation_term: comparison_relation
    association_connector_policy: binary_between
    properties:
      disease: string
      pathogen: string
      strain_or_variant: string
      reproduction_number_measure: string
      focal_country: string
      comparison_country: string
      time_scope: string
      host: string
      transmission_mode: string
      intervention_context: string
      behavioral_or_condition_context: string
      relation_term: string
      analytical_method: string
      uncertainty: string
    description: DESIGN HOLD pending a committed, versioned country resolver and
      author-reviewed alias catalog. The intended record is an explicit qualitative
      within-source comparison of one named
      reproduction-number measure between two literal countries. Both countries and
      a short literal comparison predicate must occur independently in one atomic
      source clause. Numeric country endpoints remain candidate-only; raw estimates
      belong to REPRODUCTION_NUMBER_MEASURE. Cross-source comparison is future
      DerivedAnalysis, never this source-local type.
    examples:
    - R0 was higher in Italy than in France
    - the study found a significant difference between R0 in Italy and France
  REPRODUCTION_NUMBER_TEMPORAL_TREND:
    extraction_enabled: false
    role: source_reported_analysis_design_hold
    merge_policy: source_local
    association_fields:
    - reproduction_number_measure
    - country
    - time_scope
    - relation_term
    association_field_kinds:
      reproduction_number_measure: reproduction_measure
      country: country_scope
      time_scope: temporal_scope
      relation_term: temporal_relation
    properties:
      disease: string
      pathogen: string
      strain_or_variant: string
      reproduction_number_measure: string
      country: string
      location_scope: string
      time_scope: string
      relation_term: string
      host: string
      transmission_mode: string
      intervention_context: string
      behavioral_or_condition_context: string
      analytical_method: string
      uncertainty: string
    description: DESIGN HOLD pending a committed, versioned country resolver and
      author-reviewed alias catalog. The intended record is an explicit qualitative
      within-source temporal trend for one named
      reproduction-number measure, one literal country, and one exact date or period
      scope. A short literal temporal predicate must state the direction or stability.
      Numeric endpoints and trends assembled across sources remain candidate-only.
    examples:
    - Rt declined in Italy during March 2020
    - R0 remained stable in France during the first wave
  REPRODUCTION_NUMBER_CONTEXT_ASSOCIATION:
    extraction_enabled: true
    role: source_reported_analysis
    merge_policy: source_local
    association_fields:
    - reproduction_number_measure
    - behavioral_or_condition_context
    - relation_term
    association_field_kinds:
      reproduction_number_measure: reproduction_measure
      behavioral_or_condition_context: context_factor
      relation_term: context_relation
    association_connector_policy: binary_between
    properties:
      disease: string
      pathogen: string
      strain_or_variant: string
      reproduction_number_measure: string
      behavioral_or_condition_context: string
      relation_term: string
      country: string
      location: string
      time_scope: string
      intervention_context: string
      association_qualifier: string
      analytical_method: string
      uncertainty: string
    description: An explicit within-source qualitative association between one named
      reproduction-number measure and one narrow literal behavioral or condition
      context. Preserve negation, adjustment, and the source's exact relation wording;
      this type does not infer causality. Numeric effects and cross-source synthesis
      remain candidate-only.
    examples:
    - the study found a positive association between population density and R0
    - R0 was not significantly associated with mobility
  CONTEXT_FACTOR:
    merge_policy: exact
    description: A behavioral, demographic, environmental, infrastructural, policy,
      health-system, or surveillance factor that may explain why R0 differs by country,
      setting, or time. These factors are not intrinsic biological infectious-dose
      measures.
    examples:
    - population density
    - household size
    - school contact rate
    - mask use
    - vaccination coverage
    - sanitation
    - climate
    - mobility
  INTERVENTION:
    merge_policy: exact
    description: A public-health, behavioral, clinical, environmental, or policy action
      that can modify observed transmission and therefore Rt/Re or estimated R0 if
      not properly separated.
    examples:
    - vaccination
    - lockdown
    - school closure
    - isolation
    - quarantine
    - vector control
    - water treatment
  EVIDENCE_GAP:
    extraction_enabled: false
    role: control_state
    merge_policy: immutable
    description: A statement that a needed infectious-dose measure, R0 estimate, country
      trend, or direct ID50-R0 relationship was not found, was not measured, or could
      not be compared from available evidence.
    examples:
    - no human ID50 found
    - R0 unavailable by country
    - ID50 and R0 not measured for the same disease
    - insufficient evidence for correlation
  SOURCE_DOCUMENT:
    extraction_enabled: false
    role: evidence_source
    merge_policy: immutable
    description: A canonical publication, report, dataset, or other source identity.
    properties:
      canonical_locator: string
      title: string
      identifiers: object
    examples: []
  SOURCE_VERSION:
    extraction_enabled: false
    role: evidence_source_version
    merge_policy: immutable
    description: A content-addressed version of a source document.
    properties:
      source_document_id: identifier
      content_sha256: checksum
    examples: []
  EVIDENCE_ITEM:
    extraction_enabled: false
    role: evidence_item
    merge_policy: immutable
    description: An exact source span or explicitly marked source-context span.
    properties:
      source_version_id: identifier
      start_offset: integer
      end_offset: integer
      content_sha256: checksum
      support_kind: string
    examples: []
  FIELD_ASSERTION:
    extraction_enabled: false
    role: evidence_assertion
    merge_policy: immutable
    description: A reified source-grounded assertion about one observation field.
    properties:
      subject_id: identifier
      field_name: string
      value_json: json
      evidence_item_ids: identifier_list
      assertion_status: string
    examples: []
  RELATIONSHIP_ASSERTION:
    extraction_enabled: false
    role: evidence_assertion
    merge_policy: immutable
    description: A reified source-grounded relationship between two observations or concepts.
    properties:
      subject_id: identifier
      predicate: string
      object_id: identifier
      evidence_item_ids: identifier_list
      qualifiers: object
    examples: []
relationship_types:
  CAUSES:
    endpoints:
      source: [PATHOGEN, PATHOGEN_STRAIN_OR_VARIANT]
      target: [INFECTIOUS_DISEASE]
    description: Links a pathogen or strain to the infectious disease it causes.
    inverse: CAUSED_BY
    symmetric: false
    examples:
    - SARS-CoV-2 -> COVID-19
    - Vibrio cholerae -> cholera
  IS_STRAIN_OR_VARIANT_OF:
    endpoints:
      source: [PATHOGEN_STRAIN_OR_VARIANT]
      target: [PATHOGEN]
    description: Links a strain, serotype, lineage, subtype, or variant to its parent
      pathogen.
    inverse: HAS_STRAIN_OR_VARIANT
    symmetric: false
    examples:
    - SARS-CoV-2 Delta variant -> SARS-CoV-2
    - Influenza A/H1N1 -> Influenza A virus
  HAS_HOST:
    description: Links a disease, pathogen, infectious-dose measure, or R0 measure
      to the host or host system in which it applies.
    inverse: HOST_FOR
    symmetric: false
    examples:
    - HID50 estimate -> humans
    - influenza transmission estimate -> ferrets
  HAS_INFECTIOUS_DOSE_MEASURE:
    endpoints:
      source: [INFECTIOUS_DISEASE, PATHOGEN, PATHOGEN_STRAIN_OR_VARIANT]
      target: [INFECTIOUS_DOSE_MEASURE]
    description: Links a disease, pathogen, or strain to a reported infectious-dose
      or dose-response measure.
    inverse: INFECTIOUS_DOSE_MEASURE_OF
    symmetric: false
    examples:
    - cholera -> ID50 estimate
    - SARS-CoV-2 -> HID50 estimate
  HAS_REPRODUCTION_NUMBER_MEASURE:
    endpoints:
      source: [INFECTIOUS_DISEASE, PATHOGEN, PATHOGEN_STRAIN_OR_VARIANT]
      target: [REPRODUCTION_NUMBER_MEASURE]
    description: Links a disease, pathogen, or strain to a reported R0, Rt, Re,
      or related reproduction-number estimate.
    inverse: REPRODUCTION_NUMBER_MEASURE_OF
    symmetric: false
    examples:
    - measles -> R0 estimate
    - COVID-19 in Italy -> R0 estimate
  HAS_MEASURE_TYPE:
    endpoints:
      source: [INFECTIOUS_DOSE_MEASURE, REPRODUCTION_NUMBER_MEASURE]
      target: [MEASURE_TYPE]
    description: Links an infectious-dose or reproduction-number measure to its standardized
      measure type.
    inverse: TYPE_OF_MEASURE
    symmetric: false
    examples:
    - human infectious dose estimate -> HID50
    - basic reproduction number estimate -> R0
  USES_EXPOSURE_ROUTE:
    endpoints:
      source: [INFECTIOUS_DOSE_MEASURE]
      target: [EXPOSURE_ROUTE]
    description: Links an infectious-dose measure to the biological route of exposure
      or inoculation used or assumed.
    inverse: ROUTE_USED_BY
    symmetric: false
    examples:
    - influenza ID50 estimate -> aerosol
    - cholera ID50 estimate -> oral
  HAS_TRANSMISSION_MODE:
    description: Links a disease, pathogen, or reproduction-number measure to the
      dominant mode of transmission being modeled or observed.
    inverse: TRANSMISSION_MODE_OF
    symmetric: false
    examples:
    - measles -> airborne
    - cholera -> fecal-oral
  APPLIES_TO_COUNTRY:
    endpoints:
      source: [REPRODUCTION_NUMBER_MEASURE, REPRODUCTION_NUMBER_CONTEXT_ASSOCIATION,
        CONTEXT_FACTOR, INTERVENTION]
      target: [COUNTRY]
    description: Links an R0 measure, explicit source-reported R0 relation,
      context factor, or intervention to a country.
    inverse: COUNTRY_HAS_RECORD
    symmetric: false
    examples:
    - COVID-19 R0 estimate -> Italy
    - vaccination coverage -> United States
  APPLIES_TO_LOCATION:
    description: Links an estimate, source, outbreak, intervention, or context factor
      to a non-country location or to a geographic scope such as global or regional.
    inverse: LOCATION_HAS_RECORD
    symmetric: false
    examples:
    - Ebola R0 estimate -> West Africa
    - COVID-19 early outbreak estimate -> Wuhan
  PART_OF_LOCATION:
    description: Links a smaller location to a larger location for geographic aggregation.
    inverse: CONTAINS_LOCATION
    symmetric: false
    examples:
    - Wuhan -> China
    - Lombardy -> Italy
  APPLIES_TO_TIME_PERIOD:
    description: Links an estimate, comparison, trend, intervention, or source record
      to the time period over which it applies.
    inverse: TIME_PERIOD_HAS_RECORD
    symmetric: false
    examples:
    - COVID-19 R0 estimate -> January-March 2020
    - measles R0 estimate -> pre-vaccination era
  REPORTED_BY:
    description: Links a measure, comparison, country record, context factor, intervention,
      or evidence gap to the source that reported it.
    inverse: REPORTS
    symmetric: false
    examples:
    - measles R0 estimate -> systematic review
    - cholera ID50 estimate -> human challenge study
  DERIVED_USING_METHOD:
    description: Links an infectious-dose measure, R0 measure, comparison, or trend
      to the model or analytical method used to derive it.
    inverse: METHOD_USED_TO_DERIVE
    symmetric: false
    examples:
    - R0 estimate -> SIR model
    - ID50 estimate -> dose-response model
  COMPARES_INFECTIOUS_DOSE:
    endpoints:
      source: [ID50_R0_COMPARISON]
      target: [INFECTIOUS_DOSE_MEASURE]
    description: Links an ID50-R0 comparison result to the infectious-dose measure
      or measures included in the comparison.
    inverse: INCLUDED_IN_ID50_R0_COMPARISON
    symmetric: false
    examples:
    - measles ID50-R0 comparison -> measles ID50 estimate
  COMPARES_REPRODUCTION_NUMBER:
    endpoints:
      source: [ID50_R0_COMPARISON]
      target: [REPRODUCTION_NUMBER_MEASURE]
    description: Links an ID50-R0 comparison result to the R0 or other reproduction-number
      measure included in the comparison.
    inverse: INCLUDED_IN_ID50_R0_COMPARISON
    symmetric: false
    examples:
    - measles ID50-R0 comparison -> measles R0 estimate
  HAS_ID50_R0_COMPARISON:
    description: Links a disease, pathogen, strain, or compilation source to a curated
      result comparing infectious dose and R0.
    inverse: ID50_R0_COMPARISON_FOR
    symmetric: false
    examples:
    - measles -> reported negative ID50-R0 association
    - cholera -> reported absence of an ID50-R0 association
  HAS_COUNTRY_R0_RECORD:
    extraction_enabled: false
    role: legacy_compatibility_link
    merge_policy: immutable
    description: Links a disease, pathogen, strain, or country to a country-level
      legacy R0 record. It remains readable for old graphs but is never newly
      extracted.
    inverse: COUNTRY_R0_RECORD_FOR
    symmetric: false
    examples:
    - COVID-19 -> Italy R0 record
    - Italy -> COVID-19 R0 record
  HAS_COUNTRY_REPRODUCTION_NUMBER_COMPARISON:
    extraction_enabled: false
    role: source_reported_relationship_design_hold
    merge_policy: source_local
    endpoints:
      source: [INFECTIOUS_DISEASE, PATHOGEN, PATHOGEN_STRAIN_OR_VARIANT, COUNTRY]
      target: [COUNTRY_REPRODUCTION_NUMBER_COMPARISON]
    description: Links a disease, pathogen, strain, or country to an explicit
      qualitative within-source comparison between two countries.
    inverse: COUNTRY_REPRODUCTION_NUMBER_COMPARISON_FOR
    symmetric: false
    examples:
      - COVID-19 -> explicit country R0 comparison
  HAS_REPRODUCTION_NUMBER_TEMPORAL_TREND:
    extraction_enabled: false
    role: source_reported_relationship_design_hold
    merge_policy: source_local
    endpoints:
      source: [INFECTIOUS_DISEASE, PATHOGEN, PATHOGEN_STRAIN_OR_VARIANT, COUNTRY]
      target: [REPRODUCTION_NUMBER_TEMPORAL_TREND]
    description: Links a disease, pathogen, strain, or country to an explicit
      qualitative within-source reproduction-number temporal trend.
    inverse: REPRODUCTION_NUMBER_TEMPORAL_TREND_FOR
    symmetric: false
    examples:
      - COVID-19 -> reported Rt decline in Italy during March 2020
  HAS_REPRODUCTION_NUMBER_CONTEXT_ASSOCIATION:
    merge_policy: source_local
    endpoints:
      source: [INFECTIOUS_DISEASE, PATHOGEN, PATHOGEN_STRAIN_OR_VARIANT, CONTEXT_FACTOR]
      target: [REPRODUCTION_NUMBER_CONTEXT_ASSOCIATION]
    description: Links a disease, pathogen, strain, or context factor to an explicit
      source-reported association with a reproduction-number measure. It does not
      imply causality.
    inverse: REPRODUCTION_NUMBER_CONTEXT_ASSOCIATION_FOR
    symmetric: false
    examples:
      - population density -> reported association with R0
  EXPLAINS_OR_CONTEXTUALIZES:
    description: Links a context factor to an R0 measure, country R0 record, country,
      disease, or trend that it may help explain. This relationship is for behavioral,
      environmental, demographic, policy, or surveillance influences on transmission.
    inverse: CONTEXTUALIZED_BY
    symmetric: false
    examples:
    - population density -> COVID-19 R0 in Italy
    - school contact rate -> measles R0
    - sanitation -> cholera R0
  ADJUSTED_FOR_CONTEXT_FACTOR:
    description: Links an R0 measure, comparison, or country trend to a context factor
      that was included as an adjustment, stratification, mediator, or confounder
      in the analysis.
    inverse: CONTEXT_FACTOR_ADJUSTED_IN
    symmetric: false
    examples:
    - country R0 trend model -> population density
    - COVID-19 R0 regression -> mobility
  OCCURS_DURING_INTERVENTION:
    description: Links an R0/Rt/Re estimate, time period, country record, or trend
      to an intervention active during the measurement period.
    inverse: INTERVENTION_ACTIVE_DURING
    symmetric: false
    examples:
    - COVID-19 Rt estimate -> lockdown
    - measles transmission estimate -> vaccination campaign
  ADJUSTED_FOR_INTERVENTION:
    description: Links an R0 measure, comparison, or country trend to an intervention
      that was explicitly accounted for in estimation or modeling.
    inverse: INTERVENTION_ADJUSTED_IN
    symmetric: false
    examples:
    - COVID-19 R0 model -> school closure
    - malaria transmission model -> vector control
  HAS_EVIDENCE_GAP:
    description: Links a disease, pathogen, country, source, or compilation to a statement
      that relevant infectious-dose, R0, comparison, or country-trend evidence is
      missing or insufficient.
    inverse: EVIDENCE_GAP_FOR
    symmetric: false
    examples:
    - disease compilation -> no human ID50 found
    - rare disease -> R0 unavailable by country
  CONTRADICTS_OR_DIFFERS_FROM:
    description: Links two measures, comparisons, trends, or sources when they report
      conflicting values, incompatible assumptions, or materially different conclusions.
    inverse: CONTRADICTS_OR_DIFFERS_FROM
    symmetric: true
    examples:
    - one COVID-19 R0 estimate -> another COVID-19 R0 estimate
    - one ID50-R0 comparison -> conflicting comparison
  VERSION_OF_SOURCE:
    extraction_enabled: false
    role: evidence_link
    merge_policy: immutable
    description: Connects an immutable source version to its canonical source document.
