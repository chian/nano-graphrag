<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Scenes</title>
  <style>
    :root {
      --bg: #07111b;
      --panel: rgba(8, 16, 24, 0.84);
      --ink: #f7f1e6;
      --muted: #a8b6c5;
      --classic: #5cc4ff;
      --llm: #ffd166;
      --rag: #7ae582;
      --gasl: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Georgia, "Times New Roman", serif; background: radial-gradient(circle at top, #10304d, #07111b 58%); color: var(--ink); }
    .stage { width: 100%; height: 100%; position: relative; display: grid; grid-template-rows: 18% 55% 27%; }
    .header { padding: 28px 44px 16px; }
    .eyebrow { font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.65); }
    .title { margin-top: 10px; font-size: 42px; line-height: 1.08; max-width: 980px; }
    .subtitle { margin-top: 10px; max-width: 920px; font-size: 19px; line-height: 1.4; color: var(--muted); }
    .visual { position: relative; padding: 0 36px; }
    .scene { display:none; width:100%; height:100%; position:relative; border-radius: 28px; overflow:hidden; border: 1px solid rgba(255,255,255,0.08); background: rgba(8,16,24,0.6); }
    body.scene-bridge .scene.bridge,
    body.scene-axes .scene.axes,
    body.scene-classic_machine .scene.classic_machine,
    body.scene-llm_flood .scene.llm_flood,
    body.scene-rag_beam .scene.rag_beam,
    body.scene-gasl_workbench .scene.gasl_workbench,
    body.scene-command_constellation .scene.command_constellation,
    body.scene-access_map .scene.access_map,
    body.scene-assembly_pipeline .scene.assembly_pipeline,
    body.scene-compilation_atlas .scene.compilation_atlas,
    body.scene-validation_gate .scene.validation_gate,
    body.scene-answer_board .scene.answer_board { display:block; }
    .system-tag { position:absolute; top:16px; left:16px; padding:7px 11px; border-radius:999px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; border:1px solid rgba(255,255,255,0.08); background: rgba(8,16,24,0.64); }
    .system-tag.classic { color:var(--classic); }
    .system-tag.llm { color:var(--llm); }
    .system-tag.rag { color:var(--rag); }
    .system-tag.gasl { color:var(--gasl); }
    .cols2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; height:100%; padding:26px; }
    .panel { position:relative; border-radius:22px; overflow:hidden; background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); }
    .panel .label { position:absolute; top:16px; left:16px; font-size:18px; }
    .panel .sub { position:absolute; top:44px; left:16px; color:var(--muted); font-size:14px; }
    .axesPlane { position:absolute; inset:20px; border-radius:18px; background:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 100% 20%,
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 20% 100%; }
    .point { position:absolute; width:18px; height:18px; border-radius:50%; box-shadow: 0 0 16px currentColor; }
    .point.classic { left:23%; top:35%; color:var(--classic); background:var(--classic); }
    .point.llm { left:76%; top:18%; color:var(--llm); background:var(--llm); }
    .point.rag { left:55%; top:52%; color:var(--rag); background:var(--rag); }
    .point.gasl { left:64%; top:38%; color:var(--gasl); background:var(--gasl); }
    .bridgeHalf { position:absolute; top:0; bottom:0; width:50%; }
    .bridgeHalf.left { left:0; background:linear-gradient(180deg, rgba(60,70,95,.9), rgba(16,20,36,.95)); }
    .bridgeHalf.right { right:0; background:linear-gradient(180deg, rgba(38,72,96,.9), rgba(10,20,30,.95)); }
    .bridgeShape { position:absolute; inset:18px; border-radius:22px; }
    .faultline { position:absolute; left:50%; top:18%; width:2px; height:64%; background:linear-gradient(180deg, transparent, rgba(255,255,255,.25), transparent); box-shadow:0 0 24px rgba(255,255,255,.12); }
    .ridge { position:absolute; width:70%; height:4px; background:linear-gradient(90deg, transparent, #9ad5ff, transparent); top:55%; left:15%; transform:rotate(-8deg); box-shadow:0 0 22px rgba(154,213,255,.2); }
    .gridTable { position:absolute; inset:72px 18px 18px; display:grid; grid-template-rows: repeat(6,1fr); gap:8px; }
    .gridTable .row { border-radius:10px; background:rgba(92,196,255,.08); border:1px solid rgba(92,196,255,.2); }
    .contextField { position:absolute; inset:18px; }
    .contextField .sheet { position:absolute; width:32%; height:22%; border-radius:14px; border:1px solid rgba(255,209,102,.25); background:rgba(255,209,102,.08); animation:drift 5.4s ease-in-out infinite; }
    .contextField .sheet:nth-child(1){ left:4%; top:10%; }
    .contextField .sheet:nth-child(2){ left:37%; top:26%; animation-delay:.4s; }
    .contextField .sheet:nth-child(3){ left:64%; top:10%; animation-delay:.8s; }
    .contextField .sheet:nth-child(4){ left:14%; top:56%; animation-delay:1.2s; }
    .contextField .sheet:nth-child(5){ left:52%; top:58%; animation-delay:1.6s; }
    .coreBig { position:absolute; width:180px; height:180px; left:calc(50% - 90px); top:calc(50% - 90px); border-radius:50%; border:1px solid rgba(255,209,102,.35); box-shadow:0 0 80px rgba(255,209,102,.12); }
    .costMeter { position:absolute; left:18px; right:18px; bottom:18px; height:18px; border-radius:999px; background:rgba(255,255,255,.05); overflow:hidden; }
    .costMeter span { display:block; height:100%; width:88%; background:linear-gradient(90deg, #ffd166, #ff6b6b); animation:pulsewidth 4.2s ease-in-out infinite; }
    .beamField { position:absolute; inset:0; background:
      radial-gradient(circle at 20% 30%, rgba(122,229,130,.16), transparent 16%),
      radial-gradient(circle at 78% 60%, rgba(122,229,130,.14), transparent 14%),
      radial-gradient(circle at 57% 20%, rgba(122,229,130,.16), transparent 15%),
      radial-gradient(circle at 32% 72%, rgba(122,229,130,.12), transparent 13%); }
    .beam { position:absolute; width:180px; height:180px; border-radius:50%; border:1px solid rgba(122,229,130,.38); box-shadow:0 0 60px rgba(122,229,130,.18); animation:spot 6.2s ease-in-out infinite; }
    .trayWide { position:absolute; left:18px; right:18px; bottom:18px; height:82px; display:flex; gap:10px; }
    .trayWide .card { flex:1; border-radius:14px; background: rgba(122,229,130,.10); border:1px solid rgba(122,229,130,.2); animation:trayfloat 3.2s ease-in-out infinite; }
    .trayWide .card:nth-child(2){ animation-delay:.3s } .trayWide .card:nth-child(3){ animation-delay:.6s } .trayWide .card:nth-child(4){ animation-delay:.9s }
    .bench { position:absolute; inset:18px; display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); gap:12px; }
    .bin { border-radius:18px; border:1px solid rgba(255,107,107,.2); background:rgba(255,107,107,.08); position:relative; overflow:hidden; }
    .bin::after { content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:rgba(255,107,107,.35); left:-12px; top:calc(50% - 9px); animation:flow 2.8s linear infinite; }
    .gate { position:absolute; left:calc(50% - 48px); top:calc(50% - 24px); width:96px; height:48px; border-radius:999px; border:1px solid rgba(255,107,107,.35); background:rgba(255,107,107,.1); box-shadow:0 0 24px rgba(255,107,107,.12); }
    .orbit { position:absolute; inset:40px; }
    .hub { position:absolute; width:110px; height:110px; left:calc(50% - 55px); top:calc(50% - 55px); border-radius:50%; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03); }
    .sat { position:absolute; width:150px; height:54px; border-radius:999px; border:1px solid rgba(255,107,107,.22); background:rgba(255,107,107,.08); text-align:center; line-height:54px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
    .sat.s1{ left:calc(50% - 75px); top:0; } .sat.s2{ right:0; top:calc(50% - 27px);} .sat.s3{ left:calc(50% - 75px); bottom:0;} .sat.s4{ left:0; top:calc(50% - 27px);}
    .sat.s5{ left:8%; top:18%; width:110px; } .sat.s6{ right:8%; bottom:18%; width:110px; }
    .mapField { position:absolute; inset:18px; background:
      radial-gradient(circle at 20% 28%, rgba(92,196,255,.22), transparent 14%),
      radial-gradient(circle at 38% 44%, rgba(92,196,255,.22), transparent 14%),
      radial-gradient(circle at 64% 38%, rgba(92,196,255,.22), transparent 14%),
      radial-gradient(circle at 74% 66%, rgba(92,196,255,.22), transparent 14%); }
    .path { position:absolute; height:3px; background:linear-gradient(90deg, transparent, var(--classic), transparent); box-shadow:0 0 16px rgba(92,196,255,.26); }
    .path.p1{ left:22%; top:34%; width:20%; transform:rotate(14deg);} .path.p2{ left:40%; top:42%; width:27%; transform:rotate(-8deg);} .path.p3{ left:58%; top:51%; width:18%; transform:rotate(26deg);}
    .pipe { position:absolute; inset:22px; display:flex; align-items:center; gap:18px; }
    .pipe .box { flex:1; height:150px; border-radius:18px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); position:relative; }
    .pipe .arrow { width:70px; height:4px; background:linear-gradient(90deg, rgba(255,255,255,.2), var(--gasl)); box-shadow:0 0 16px rgba(255,107,107,.2); }
    .atlas { position:absolute; inset:22px; }
    .contour { position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.08); }
    .contour.c1{ width:80%; height:58%; left:10%; top:22%; } .contour.c2{ width:64%; height:46%; left:18%; top:28%; } .contour.c3{ width:46%; height:30%; left:27%; top:36%; }
    .hist { position:absolute; left:18px; right:18px; bottom:18px; height:110px; display:flex; align-items:flex-end; gap:10px; }
    .hist .bar { flex:1; background:linear-gradient(180deg, rgba(255,107,107,.9), rgba(255,107,107,.2)); border-radius:12px 12px 0 0; }
    .hist .bar:nth-child(1){ height:34%; } .hist .bar:nth-child(2){ height:62%; } .hist .bar:nth-child(3){ height:78%; } .hist .bar:nth-child(4){ height:50%; } .hist .bar:nth-child(5){ height:26%; }
    .gateScene { position:absolute; inset:22px; display:grid; grid-template-columns:1fr 120px 1fr; gap:20px; align-items:center; }
    .gateScene .leftcol, .gateScene .rightcol { height:100%; border-radius:20px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); position:relative; }
    .gateScene .center { height:180px; border-radius:999px; border:1px solid rgba(255,107,107,.35); background:rgba(255,107,107,.12); box-shadow:0 0 30px rgba(255,107,107,.12); position:relative; }
    .gateScene .pulse { position:absolute; width:22px; height:22px; border-radius:50%; background:var(--gasl); top:calc(50% - 11px); left:-11px; animation:flow 2.4s linear infinite; }
    .board { position:absolute; inset:22px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .board .tablePane { border-radius:20px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); position:relative; }
    .board .answerPane { border-radius:20px; background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.18); position:relative; }
    .classic .table { position: absolute; left: 14px; right: 14px; top: 16px; bottom: 16px; display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; }
    .classic .row { border-radius: 10px; background: rgba(92,196,255,0.10); border: 1px solid rgba(92,196,255,0.24); position: relative; overflow: hidden; }
    .classic .row::after { content:""; position: absolute; left: -35%; top: 0; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(92,196,255,0.26), transparent); animation: scan 3.6s linear infinite; }
    .classic .joinline { position: absolute; top: 42%; left: 10%; width: 80%; height: 2px; background: linear-gradient(90deg, transparent, var(--classic), transparent); box-shadow: 0 0 12px rgba(92,196,255,0.35); }
    .llm .docs { position:absolute; inset: 12px; }
    .llm .doc { position:absolute; width: 34%; height: 24%; border-radius: 12px; border: 1px solid rgba(255,209,102,0.22); background: rgba(255,209,102,0.08); animation: drift 5.4s ease-in-out infinite; }
    .llm .doc:nth-child(1) { left: 4%; top: 8%; }
    .llm .doc:nth-child(2) { left: 52%; top: 12%; animation-delay: .7s; }
    .llm .doc:nth-child(3) { left: 12%; top: 52%; animation-delay: 1.2s; }
    .llm .core { position:absolute; width: 140px; height: 140px; left: calc(50% - 70px); top: calc(50% - 70px); border-radius: 50%; border: 1px solid rgba(255,209,102,0.35); box-shadow: 0 0 40px rgba(255,209,102,0.16); }
    .llm .meter { position:absolute; left: 14px; right: 14px; bottom: 14px; height: 14px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .llm .meter > span { display:block; height:100%; width: 82%; background: linear-gradient(90deg, #f1c453, #ff6f61); animation: pulsewidth 4.2s ease-in-out infinite; }
    .rag .field { position:absolute; inset: 0; background:
      radial-gradient(circle at 25% 35%, rgba(122,229,130,.24), transparent 18%),
      radial-gradient(circle at 72% 42%, rgba(122,229,130,.22), transparent 16%),
      radial-gradient(circle at 62% 75%, rgba(122,229,130,.18), transparent 18%);
    }
    .rag .spot { position:absolute; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(122,229,130,0.40); box-shadow: 0 0 50px rgba(122,229,130,0.18); animation: spot 6.2s ease-in-out infinite; }
    .rag .tray { position:absolute; left: 14px; right: 14px; bottom: 14px; height: 68px; display:flex; gap:8px; }
    .rag .card { flex:1; border-radius:12px; background: rgba(122,229,130,0.10); border: 1px solid rgba(122,229,130,0.20); transform: translateY(0); animation: trayfloat 3.2s ease-in-out infinite; }
    .rag .card:nth-child(2) { animation-delay: .3s; }
    .rag .card:nth-child(3) { animation-delay: .6s; }
    .gasl .bench { position:absolute; inset: 12px; display:grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2,1fr); gap:10px; }
    .gasl .bin { border-radius: 14px; border: 1px solid rgba(255,107,107,0.22); background: rgba(255,107,107,0.08); position: relative; overflow: hidden; }
    .gasl .bin::after { content:""; position:absolute; width: 18px; height:18px; border-radius:50%; background: rgba(255,107,107,0.42); left: -12px; top: calc(50% - 9px); animation: flow 2.8s linear infinite; }
    .gasl .gate { position:absolute; left: calc(50% - 40px); top: calc(50% - 20px); width: 80px; height: 40px; border-radius: 999px; border:1px solid rgba(255,107,107,0.35); background: rgba(255,107,107,0.10); box-shadow: 0 0 24px rgba(255,107,107,0.12); }
    .gasl .loop { position:absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin-left: -75px; margin-top:-75px; border-radius: 50%; border:1px dashed rgba(255,107,107,0.25); animation: spin 11s linear infinite; }
    .footer { padding: 16px 36px 30px; display:grid; grid-template-columns: 1.2fr .8fr; gap: 16px; align-items: end; }
    .story { background: rgba(8,16,24,0.70); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 22px 24px; min-height: 180px; }
    .story h4 { margin: 0; font-size: 28px; line-height: 1.1; }
    .story p { margin: 10px 0 0; font-size: 18px; line-height: 1.45; color: var(--ink); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .chip { padding: 7px 10px; border-radius: 999px; border:1px solid rgba(255,107,107,0.25); background: rgba(255,107,107,0.12); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .progress-wrap { display:flex; align-items:center; gap:12px; justify-content: end; }
    .progress { width: 320px; height: 10px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .progress > span { display:block; height:100%; width: 0; background: linear-gradient(90deg, rgba(255,255,255,0.2), #ff6b6b); transition: width .3s ease; }
    .counter { min-width: 76px; text-align: right; font-size: 16px; color: var(--muted); }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(520%); } }
    @keyframes drift { 0%,100% { transform: translateY(0px) rotate(0deg);} 50% { transform: translateY(-12px) rotate(1.6deg);} }
    @keyframes pulsewidth { 0%,100% { width: 78%; } 50% { width: 96%; } }
    @keyframes spot { 0%,100% { left: 12%; top: 18%; } 33% { left: 58%; top: 26%; } 66% { left: 36%; top: 56%; } }
    @keyframes trayfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes flow { from { left: -12px; } to { left: calc(100% + 12px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="header">
      <div class="eyebrow">GASL tutorial fragment</div>
      <div class="title" id="sceneTitle">Loading…</div>
      <div class="subtitle" id="sceneSubtitle"></div>
    </div>
    <div class="visual">
      <div class="scene bridge">
        <div class="bridgeHalf left"><div class="system-tag llm">Claim</div><div class="bridgeShape"><div class="faultline"></div></div></div>
        <div class="bridgeHalf right"><div class="system-tag gasl">Compilation</div><div class="bridgeShape"><div class="ridge"></div></div></div>
      </div>
      <div class="scene axes">
        <div class="axesPlane">
          <div class="point classic"></div><div class="point llm"></div><div class="point rag"></div><div class="point gasl"></div>
        </div>
      </div>
      <div class="scene classic_machine">
        <div class="system-tag classic">Classic systems</div>
        <div class="gridTable"><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div></div>
      </div>
      <div class="scene llm_flood">
        <div class="system-tag llm">LLM-only</div>
        <div class="contextField"><div class="sheet"></div><div class="sheet"></div><div class="sheet"></div><div class="sheet"></div><div class="sheet"></div><div class="coreBig"></div><div class="costMeter"><span></span></div></div>
      </div>
      <div class="scene rag_beam">
        <div class="system-tag rag">RAG</div>
        <div class="beamField"></div><div class="beam"></div><div class="trayWide"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div>
      </div>
      <div class="scene gasl_workbench">
        <div class="system-tag gasl">GASL</div>
        <div class="bench"><div class="bin"></div><div class="bin"></div><div class="bin"></div><div class="bin"></div></div><div class="gate"></div>
      </div>
      <div class="scene command_constellation">
        <div class="system-tag gasl">Command families</div>
        <div class="orbit"><div class="hub"></div><div class="sat s1">Working memory</div><div class="sat s2">Access</div><div class="sat s3">Compilation</div><div class="sat s4">Assembly</div><div class="sat s5">Validation</div><div class="sat s6">Answering</div></div>
      </div>
      <div class="scene access_map">
        <div class="system-tag gasl">Access modes</div>
        <div class="mapField"></div><div class="path p1"></div><div class="path p2"></div><div class="path p3"></div>
      </div>
      <div class="scene assembly_pipeline">
        <div class="system-tag gasl">Assembly</div>
        <div class="pipe"><div class="box"></div><div class="arrow"></div><div class="box"></div><div class="arrow"></div><div class="box"></div></div>
      </div>
      <div class="scene compilation_atlas">
        <div class="system-tag gasl">Compilation</div>
        <div class="atlas"><div class="contour c1"></div><div class="contour c2"></div><div class="contour c3"></div><div class="hist"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div>
      </div>
      <div class="scene validation_gate">
        <div class="system-tag gasl">Validation & repair</div>
        <div class="gateScene"><div class="leftcol"></div><div class="center"><div class="pulse"></div></div><div class="rightcol"></div></div>
      </div>
      <div class="scene answer_board">
        <div class="system-tag gasl">Answer views</div>
        <div class="board"><div class="tablePane"></div><div class="answerPane"></div></div>
      </div>
    </div>
    <div class="footer">
      <div class="story">
        <h4 id="frameTitle">Loading…</h4>
        <p id="frameBody"></p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="progress-wrap">
        <div class="progress"><span id="progressBar"></span></div>
        <div class="counter" id="counter">0 / 0</div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const sceneId = params.get("scene");
    const sceneApi = sceneId ? `/api/scenes/${sceneId}` : "/api/scenes";
    const titleEl = document.getElementById("sceneTitle");
    const subtitleEl = document.getElementById("sceneSubtitle");
    const frameTitleEl = document.getElementById("frameTitle");
    const frameBodyEl = document.getElementById("frameBody");
    const chipsEl = document.getElementById("chips");
    const barEl = document.getElementById("progressBar");
    const counterEl = document.getElementById("counter");

    async function loadScene() {
      let scene;
      if (sceneId) {
        scene = await fetch(sceneApi).then(r => r.json());
      } else {
        const scenes = await fetch("/api/scenes").then(r => r.json());
        scene = scenes.scenes[0];
      }
      titleEl.textContent = `${String(scene.order).padStart(2, "0")} · ${scene.title}`;
      subtitleEl.textContent = scene.subtitle;
      document.body.className = `scene-${scene.stage_type || "bridge"}`;
      runFrames(scene.frames || []);
    }

    function renderFrame(frame, idx, total) {
      frameTitleEl.textContent = frame.title;
      frameBodyEl.textContent = frame.body;
      chipsEl.innerHTML = "";
      (frame.gasl_chips || []).forEach(text => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = text;
        chipsEl.appendChild(chip);
      });
      barEl.style.width = `${((idx + 1) / total) * 100}%`;
      counterEl.textContent = `${idx + 1} / ${total}`;
    }

    function runFrames(frames) {
      let idx = 0;
      function step() {
        if (idx >= frames.length) return;
        const frame = frames[idx];
        renderFrame(frame, idx, frames.length);
        idx += 1;
        setTimeout(step, frame.duration_ms || 4000);
      }
      step();
    }

    loadScene();
  </script>
